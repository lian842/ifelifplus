<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lian UI Board</title>
  <style>
    :root { color-scheme: light; background:#e9edef; color:#28363d; font-family:SUIT,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; padding:36px; }
    header { max-width:1440px; margin:0 auto 30px; }
    h1 { margin:0; font-size:28px; letter-spacing:-.04em; }
    header p { margin:9px 0 0; color:rgba(40,54,61,.56); font-size:13px; }
    nav { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
    nav a { padding:7px 10px; color:#56658e; border:1px solid rgba(168,180,217,.55); border-radius:999px; background:rgba(255,255,255,.7); font-size:11px; text-decoration:none; }
    main { max-width:1440px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; margin:auto; }
    article { overflow:hidden; border:1px solid rgba(79,98,107,.13); border-radius:24px; background:#f8fafa; box-shadow:0 18px 46px rgba(44,58,64,.09); }
    article h2 { margin:0; padding:13px 17px; color:rgba(40,54,61,.62); border-bottom:1px solid rgba(79,98,107,.1); font-size:12px; font-weight:600; }
    iframe { width:100%; height:720px; display:block; border:0; background:#eef1f2; }
    @media(max-width:1000px){ main{grid-template-columns:1fr;} body{padding:18px;} }
  </style>
</head>
<body>
  <header>
    <h1>Lian 활성 화면 보드</h1>
    <p>각 프레임은 실제 <code>styles.css</code>와 <code>tips.css</code>를 사용합니다. 제목을 누르면 개별 라우트로 열 수 있습니다.</p>
    <nav id="routes"></nav>
  </header>
  <main id="board"></main>
  <script>
    const screens = [
      ["context-remaining", "첫 화면 · 잔여"],
      ["context-zero", "첫 화면 · 0원"],
      ["context-shortage", "첫 화면 · 부족"],
      ["loading", "분석 로딩 + 금융 팁"],
      ["interview", "상품별 인터뷰"],
      ["result", "최종 재검토"],
      ["extraction-error", "상품 추출 실패"],
      ["backend-error", "백엔드 연결 실패"],
    ];
    const route = ([id,label]) => `<a href="/ui-preview?screen=${id}" target="_blank">${label}</a>`;
    document.getElementById("routes").innerHTML = screens.map(route).join("");
    document.getElementById("board").innerHTML = screens.map(([id,label]) => `
      <article><h2><a href="/ui-preview?screen=${id}" target="_blank">${label}</a></h2><iframe loading="lazy" src="/ui-preview?screen=${id}" title="${label}"></iframe></article>
    `).join("");
  </script>
</body>
</html>
